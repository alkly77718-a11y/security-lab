name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Gradle
      run: sudo apt-get update && sudo apt-get install -y gradle

    - name: Locate Project and Build APK
      run: |
        set -euo pipefail
        
        echo "=== Listing repository files for debugging ==="
        find . -maxdepth 3
        
        # البحث الآمن عن ملف إعدادات أندرويد دون التسبب بانهيار السكربت
        PROJECT_FILE=$(find . \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit || true)
        
        if [ -z "${PROJECT_FILE}" ]; then
          echo "Error: Could not find settings.gradle or settings.gradle.kts in the repository."
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$PROJECT_FILE")
        echo "Found Android project in directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # إنشاء الـ Wrapper إذا لم يكن موجوداً
        if [ ! -f "./gradlew" ]; then
          echo "No gradlew wrapper found; generating wrapper with system gradle"
          gradle wrapper --gradle-version 7.6
          chmod +x ./gradlew
        fi
        
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: C2-Debug-APK
        path: '**/build/outputs/apk/debug/*.apk'
