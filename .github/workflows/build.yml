name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Gradle
      run: sudo apt-get update && sudo apt-get install -y gradle

    - name: Locate Project and Build APK
      run: |
        PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: Could not find settings.gradle in the repository."
          exit 1
        fi
        echo "Found Android project in directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        gradle wrapper --gradle-version 7.6
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: C2-Debug-APK
        path: '**/build/outputs/apk/debug/*.apk'
